<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Form • Domingues Family Recipes</title>
    <meta name="author" content="Nicolas Domingues Falcão">
    <meta name="description" content="Story of the Domingues family recipes, passed down through generations.">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/project.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">


</head>
<body>
    <header>
        <h1>Domingues Family Recipes</h1>
        <button class="menu-toggle">☰</button>
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="recipes.html">Main Recipes</a>
            <a href="desserts.html">Desserts</a>
            <a href="form.html">Subscribe</a>
        </nav>
    </header>

    <main>
        <h2>Receive recipes and culinary tips every week!</h2>
        <form id="subscriptionForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="question">If you have a question, suggestion, or request, write it down! <em>(optional)</em></label>
            <textarea id="question" name="question" rows="5" placeholder="Enter your question here..."></textarea>

            <button type="submit">Subscribe</button>
        </form>
        <p id="formMessage"></p>
    </main>

    <footer>
        <p>&copy;<span id="currentYear"></span> Domingues Family Recipes. All rights reserved.</p>
    </footer>
</body>
</html>
