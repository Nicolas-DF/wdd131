<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
    <meta name="author" content="Nicolas Domingues Falcão">
    <meta name="description" content="This is a product review form that allows users to submit their reviews for a specific product.">
    <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productOptions">Product Name:</label>
            <select id="productOptions" name="productOptions" required>
                <option value="" disabled selected>Choose a Product ...</option>
            </select>

            <label for="rating">Overall Rating:</label>
            <div class="stars">
                <input type="radio" id="rating1" name="rating">&star;
                <input type="radio" id="rating2" name="rating"> &star;&star;
                <input type="radio" id="rating3" name="rating"> &star;&star;&star;
                <input type="radio" id="rating4" name="rating"> &star;&star;&star;&star;
                <input type="radio" id="rating5" name="rating"> &star;&star;&star;&star;&star;
            </div>

            <label for="installingDate">Date of Installation:</label>
            <input type="date" id="installingDate" name="installingDate" required>

            <label for="usefulFeatures">Which features did you find useful in the product?<italic>(Check all that apply)</italic></label>
            <input type="checkbox" id="durability" name="usefulFeatures">Durability
            <input type="checkbox" id="easeOfUse" name="usefulFeatures">Ease of Use
            <input type="checkbox" id="performance" name="usefulFeatures">Performance
            <input type="checkbox" id="design" name="usefulFeatures">Design

            <label for="written">Written Review (Optional)</label>
            <textarea id="written" name="written" rows="4" cols="50"></textarea>

            <label for="name">Your Name (optional)</label>
            <input type="text" id="name" name="name">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> 🪶 Nicolas Domingues Falcão 🪶 Brazil</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
