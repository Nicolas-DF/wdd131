<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <script src="scripts/form.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">
    <meta name="author" content="Nicolas Domingues Falcão">
    <meta name="description" content="This is a product review form that allows users to submit their reviews for a specific product.">
    <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--- I ran the page audit and some errors appeared. I tried to fix them, but the audit still shows some issues. -->
</head>
<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productOptions">Product Name:</label>

            <select id="productOptions" name="productOptions" required>
                <option value="" selected disabled>Select a Product ...</option>
            </select>

            <label for="rating">Overall Rating:</label>
            <div class="stars">
                <label for="rating1">&star;<input type="radio" name="rating" value="1" id="rating1" required></label>
                <label for="rating2">&star;&star;<input type="radio" name="rating" value="2" id="rating2" required></label>
                <label for="rating3">&star;&star;&star;<input type="radio" name="rating" value="3" id="rating3" required></label>
                <label for="rating4">&star;&star;&star;&star;<input type="radio" name="rating" value="4" id="rating4" required></label>
                <label for="rating5">&star;&star;&star;&star;&star;<input type="radio" name="rating" value="5" id="rating5" required></label>
            </div>

            <label for="installingDate">Date of Installation:</label>
            <input type="date" id="installingDate" name="installingDate" required>

            <label for="usefulFeatures">Which features did you find useful in the product?<em>(Check all that apply)</em></label>
            <label for="durability"><input type="checkbox" id="durability" name="usefulFeatures"> Durability</label>
            <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="usefulFeatures"> Ease of Use</label>
            <label for="performance"><input type="checkbox" id="performance" name="usefulFeatures"> Performance</label>
            <label for="design"><input type="checkbox" id="design" name="usefulFeatures"> Design</label>

            <label for="written">Written Review (Optional)</label>
            <textarea id="written" name="written" rows="4" cols="50"></textarea>

            <label for="name">Your Name (optional)</label>
            <input type="text" id="name" name="name">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentYear"></span> 🪶 Nicolas Domingues Falcão 🪶 Brazil</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
